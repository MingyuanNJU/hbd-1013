<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4FB3F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#06142C" media="(prefers-color-scheme: dark)">
  <title>生日列车</title>
  <meta property="og:title" content="生日列车 🚃">
  <meta property="og:description" content="一张只属于你的车票，请检票上车。">
  <meta name="description" content="一张只属于你的车票，请检票上车。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚃</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 湘南海岸背景 -->
  <div class="scene" aria-hidden="true">
    <div class="scene__sky"></div>
    <div class="scene__stars"></div>
    <div class="scene__sun"></div>
    <div class="scene__clouds"><i></i><i></i><i></i><i></i></div>
    <svg class="scene__island" viewBox="0 0 420 130" preserveAspectRatio="xMidYMax meet">
      <path class="island__bridge" d="M0 124 L120 116" />
      <path class="island__body" d="M96 130 C120 98 150 72 196 64 C214 61 232 62 250 66 C300 76 350 100 400 130 Z" />
      <g class="island__tower">
        <rect x="214" y="18" width="7" height="48" />
        <path d="M206 22 h23 l-3 -8 h-17 z" />
        <rect x="216.5" y="2" width="2" height="12" />
      </g>
      <path class="island__beam" d="M218 18 L420 4 L420 34 Z" />
    </svg>
    <div class="scene__sea">
      <svg class="wave wave--1" viewBox="0 0 1600 100" preserveAspectRatio="none"><path d="M0 40 Q200 10 400 40 T800 40 T1200 40 T1600 40 V100 H0 Z" /></svg>
      <svg class="wave wave--2" viewBox="0 0 1600 100" preserveAspectRatio="none"><path d="M0 50 Q200 22 400 50 T800 50 T1200 50 T1600 50 V100 H0 Z" /></svg>
      <div class="scene__glints"></div>
      <svg class="wave wave--3" viewBox="0 0 1600 100" preserveAspectRatio="none"><path d="M0 55 Q200 30 400 55 T800 55 T1200 55 T1600 55 V100 H0 Z" /></svg>
    </div>
    <div class="scene__track"><div class="mini-train" id="miniTrain"></div></div>
  </div>

  <!-- 线路图 -->
  <header class="line" id="line" hidden>
    <ol class="line__stops" id="stops"></ol>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="关闭声音" title="声音">🔊</button>
  </header>

  <main id="app">
    <!-- 0 检票口（踏切） -->
    <section class="station" data-station="gate" id="st-gate">
      <div class="wrap center">
        <svg class="crossing" id="crossing" viewBox="0 0 300 200" aria-hidden="true">
          <defs>
            <pattern id="stripe" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="8" height="16" fill="#F7C600" /><rect x="8" width="8" height="16" fill="#1B1B1B" />
            </pattern>
          </defs>
          <rect x="44" y="30" width="10" height="170" fill="url(#stripe)" />
          <g class="crossbuck">
            <rect x="9" y="22" width="80" height="14" rx="2" fill="#F7C600" stroke="#1B1B1B" stroke-width="3" transform="rotate(32 49 29)" />
            <rect x="9" y="22" width="80" height="14" rx="2" fill="#F7C600" stroke="#1B1B1B" stroke-width="3" transform="rotate(-32 49 29)" />
          </g>
          <rect x="12" y="66" width="74" height="8" rx="3" fill="#1B1B1B" />
          <g class="lamp lamp--a"><circle cx="22" cy="86" r="12" fill="#3a0d0d" /><circle class="lamp__on" cx="22" cy="86" r="10" /></g>
          <g class="lamp lamp--b"><circle cx="76" cy="86" r="12" fill="#3a0d0d" /><circle class="lamp__on" cx="76" cy="86" r="10" /></g>
          <rect x="36" y="150" width="26" height="30" rx="4" fill="#1B1B1B" />
          <g class="barrier" id="barrier">
            <rect x="49" y="158" width="246" height="11" rx="5" fill="url(#stripe)" stroke="#1B1B1B" stroke-width="1.5" />
            <circle cx="49" cy="163.5" r="6" fill="#1B1B1B" />
          </g>
        </svg>
        <div class="ticket glass">
          <div class="ticket__head">
            <span class="ticket__brand" data-text="gate.brand"></span>
            <span class="ticket__no" data-text="gate.ticketNo"></span>
          </div>
          <h1 class="ticket__title" data-text="gate.title"></h1>
          <div class="ticket__route">
            <span data-text="gate.routeFrom"></span><span class="ticket__arrow">→</span><span data-text="gate.routeTo"></span>
          </div>
          <form class="gate" id="gateForm" autocomplete="off">
            <label for="gateInput" data-text="gate.question"></label>
            <input id="gateInput" inputmode="text" enterkeyhint="go" data-placeholder="gate.placeholder">
            <p class="gate__hint" id="gateHint" hidden data-text="gate.hint"></p>
            <p class="gate__err" id="gateErr" aria-live="polite"></p>
            <button class="btn btn--primary" type="submit" data-text="gate.button"></button>
          </form>
        </div>
      </div>
    </section>

    <!-- 1 许愿 -->
    <section class="station" data-station="wish" id="st-wish" hidden>
      <div class="wrap">
        <div class="board" data-board="wish"></div>
        <div class="panel glass center">
          <p class="kicker" data-text="wish.kicker"></p>
          <h2 class="wish__prompt" id="wishPrompt" data-text="wish.prompt"></h2>
          <div class="cake" id="cake" aria-label="生日蛋糕">
            <div class="cake__candles" id="candles"></div>
            <div class="cake__top"></div>
            <div class="cake__layer cake__layer--1"></div>
            <div class="cake__layer cake__layer--2"></div>
            <div class="cake__plate"></div>
          </div>
          <div class="wish__controls" id="wishControls">
            <button class="btn btn--primary" type="button" id="micBtn" data-text="wish.micButton"></button>
            <p class="muted small" id="micNote" data-text="wish.micTip"></p>
          </div>
          <div class="wish__done" id="wishDone" hidden>
            <h1 class="hero-title" id="wishTitle"></h1>
            <p class="lead" data-text="wish.sub"></p>
            <button class="btn btn--primary next" type="button" data-text="common.next"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- 2 甜蜜点滴 -->
    <section class="station" data-station="timeline" id="st-timeline" hidden>
      <div class="wrap">
        <div class="board" data-board="timeline"></div>
        <div class="panel glass">
          <p class="kicker" data-text="timeline.kicker"></p>
          <h2 class="title" data-text="timeline.title"></h2>
          <ol class="timeline" id="timeline"></ol>
          <div class="center"><button class="btn btn--primary next" type="button" data-text="common.next"></button></div>
        </div>
      </div>
    </section>

    <!-- 3 小猫闯关 -->
    <section class="station" data-station="runner" id="st-runner" hidden>
      <div class="wrap wrap--game">
        <div class="board" data-board="runner"></div>
        <div class="panel glass">
          <p class="kicker" data-text="runner.kicker"></p>
          <h2 class="title" data-text="runner.title"></h2>
          <p class="lead" data-text="runner.intro"></p>
          <div class="stats">
            <span>🐟 <span data-text="runner.fishLabel"></span> <b id="rnFish">0</b></span>
            <span>📷 <span data-text="runner.photoLabel"></span> <b id="rnPhotos">0</b> / <b id="rnTotal">8</b></span>
          </div>
          <div class="rn">
            <div class="rn__progress"><i id="rnBar"></i></div>
            <canvas class="rn__canvas" id="rnCanvas"></canvas>
            <div class="rn__toast" id="rnToast"><img alt=""><span></span></div>
            <div class="rn__overlay" id="rnReady">
              <p class="rn__controls" data-text="runner.controls"></p>
              <button class="btn btn--primary" type="button" id="rnStart" data-text="runner.start"></button>
            </div>
            <div class="rn__overlay" id="rnDone" hidden>
              <h3 class="rn__done-title" data-text="runner.doneTitle"></h3>
              <p class="rn__done-stats" id="rnStats"></p>
              <p class="rn__done-text" id="rnResult"></p>
              <div class="row">
                <button class="btn btn--ghost" type="button" id="rnAgain" data-text="runner.again"></button>
                <button class="btn btn--primary next" type="button" data-text="common.next"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 4 打小猪 -->
    <section class="station" data-station="whack" id="st-whack" hidden>
      <div class="wrap">
        <div class="board" data-board="whack"></div>
        <div class="panel glass">
          <p class="kicker" data-text="whack.kicker"></p>
          <h2 class="title" data-text="whack.title"></h2>
          <p class="lead" data-text="whack.intro"></p>
          <div class="stats">
            <span><span data-text="whack.scoreLabel"></span> <b id="whScore">0</b></span>
            <span><span data-text="whack.timeLabel"></span> <b id="whTime">30</b> <span data-text="whack.secondsUnit"></span></span>
          </div>
          <div class="whack" id="whack"></div>
          <div class="center whack__start" id="whStartWrap">
            <button class="btn btn--primary" type="button" id="whStart" data-text="whack.start"></button>
          </div>
          <div class="done-card" id="whDone" hidden>
            <p class="done-card__score"><span data-text="whack.finalLabel"></span> <b id="whFinal">0</b></p>
            <p class="done-card__text" id="whResult"></p>
            <div class="row">
              <button class="btn btn--ghost" type="button" id="whAgain" data-text="whack.again"></button>
              <button class="btn btn--primary next" type="button" data-text="common.next"></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 5 照片墙 -->
    <section class="station" data-station="wall" id="st-wall" hidden>
      <div class="wrap wrap--wide">
        <div class="board" data-board="wall"></div>
        <div class="panel glass">
          <p class="kicker" data-text="wall.kicker"></p>
          <h2 class="title" data-text="wall.title"></h2>
          <p class="lead" data-text="wall.intro"></p>
          <div class="wall__bar">
            <button class="btn btn--primary" type="button" id="wallAdd" data-text="wall.addButton"></button>
            <input type="file" id="wallFile" accept="image/*" multiple hidden>
            <p class="muted small" id="wallStatus" aria-live="polite"></p>
          </div>
          <div class="wall" id="wall"></div>
          <div class="center"><button class="btn btn--primary next" type="button" data-text="common.nextToEnd"></button></div>
        </div>
      </div>
    </section>

    <!-- 6 终点站 -->
    <section class="station" data-station="letter" id="st-letter" hidden>
      <div class="wrap">
        <div class="board" data-board="letter"></div>
        <div class="panel glass">
          <p class="kicker" data-text="letter.kicker"></p>
          <h2 class="title" data-text="letter.title"></h2>
          <article class="letter" id="letter">
            <div class="letter__body" id="letterBody"></div>
            <p class="letter__sign" id="letterSign" hidden></p>
          </article>
          <p class="muted small center" id="letterSkip" data-text="letter.skipTip"></p>
          <div class="row center" id="letterEnd" hidden>
            <button class="btn btn--ghost" type="button" id="toWall" data-text="letter.toWall"></button>
            <button class="btn btn--primary" type="button" id="again" data-text="letter.again"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 电车驶过（换站动画） -->
  <div class="pass" id="pass" hidden aria-hidden="true">
    <div class="pass__bg" id="passBg"><div class="pass__rail" id="passRail"></div></div>
    <div class="pass__train" id="passTrain"></div>
    <div class="pass__wind"></div>
  </div>

  <!-- 大图 -->
  <div class="lightbox" id="lightbox" hidden>
    <figure class="lightbox__fig">
      <img id="lbImg" alt="">
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button class="icon-btn lightbox__close" type="button" aria-label="关闭">✕</button>
  </div>

  <!-- 上传弹窗 -->
  <div class="modal" id="upModal" hidden>
    <div class="modal__card glass" role="dialog" aria-modal="true" aria-labelledby="upTitle">
      <h3 id="upTitle" data-text="wall.modalTitle"></h3>
      <div class="up__thumbs" id="upThumbs"></div>
      <label for="upCaption" class="small muted" data-text="wall.captionLabel"></label>
      <textarea id="upCaption" rows="2" maxlength="200" data-placeholder="wall.captionPlaceholder"></textarea>
      <div class="row">
        <button class="btn btn--ghost" type="button" id="upCancel" data-text="wall.cancel"></button>
        <button class="btn btn--primary" type="button" id="upOk" data-text="wall.ok"></button>
      </div>
    </div>
  </div>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <script src="js/content.js" defer></script>
  <script src="js/scene.js" defer></script>
  <script src="js/candle.js" defer></script>
  <script src="js/runner.js" defer></script>
  <script src="js/whack.js" defer></script>
  <script src="js/wall.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
